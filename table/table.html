
<html>
<head>
    <title>Timetable</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px ;
            text-align: center;
        }
        th, td {
            border: 2px solid black;
            padding: 10px;
        }
        th {
            background-color:dar blue;
            color: black;
        }
        td {
            background-color: red;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">College Timetable</h2>

<table>
    <tr>
        <th>Day / Time</th>
        <th>12.50 - 1:40</th>
        <th>1:40 - 2:30</th>
        <th>2:30 - 2:50</th>
        <th>3:00 - 3:40</th>
        <th>4:00 - 4:30</th>
        <th>4:30 - 5:20</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>WDD</td>
        <td>BIG DATA</td>
        <td>DEV</td>
        <td rowspan="5">Break</td>
        <td>CG</td>
        <td>WDD</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>CG</td>
        <td>WDD</td>
        <td>CG</td>
        <td>WDD</td>
        <td>CG</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>CG</td>
        <td>SE</td>
        <td>SE</td>
        <td>WDD</td>
        <td>CG</td>
    </tr>

    <tr>
        <td>Thursday</td>
        <td>WDD LAB</td>
        <td>SE</td>
        <td>CG</td>
        <td>SE</td>
        <td>BIG DATA</td>
    </tr>

    <tr>
        <td>Friday</td>
        <td>BIG DATA</td>
        <td>SE</td>
        <td>WDD</td>
        <td>SE</td>
        <td>Lab</td>
    </tr>

</table>

</body>
</html>
